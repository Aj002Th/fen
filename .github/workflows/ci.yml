name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FEN_DEV_ID: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard version.properties
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "$base:version.properties" 2>/dev/null; then
            echo "首次引入 version.properties，跳过检查。"
            exit 0
          fi
          if git diff --name-only "$base...HEAD" | grep -qx 'version.properties'; then
            echo "::error::version.properties 只允许在 release/ 分支的 PR 中修改"
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          fi
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          if ! "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" >/dev/null 2>&1; then
            "$sdkmanager" --install "platforms;android-37" "build-tools;37.0.0" >/dev/null
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  scripts:
    name: scripts
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile scripts
        run: python -m py_compile scripts/fen.py

      - name: Show CLI
        run: python scripts/fen.py --help
